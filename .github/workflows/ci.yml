name: CI

# Thin caller. All logic lives in moku-labs/ci, pinned to the moving @v1 major tag.
# Required status checks land as "ci / lint", "ci / types", "ci / test", "ci / build"
# (GitHub prefixes a reusable workflow's jobs with the CALLER's job id) — see rulesets/main.json.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # No `workflow_call:` needed — publish.yml reaches the same checks through
  # package-release.yml, which calls package-ci.yml itself.

# NO concurrency block here on purpose: package-ci.yml already scopes its group by
# github.workflow (= this workflow's name), and a caller group with the same value would
# deadlock against its own child.

permissions:
  contents: read

jobs:
  ci:
    uses: moku-labs/ci/.github/workflows/package-ci.yml@v1
    with:
      # The floor of package.json `engines.bun` (D-58). Without it the checks run on `latest`.
      bun_version: "1.4.2"

  # The moku demos (moku-labs/demos) against this PR's editor preview, published by `ci`. The label
  # `demos:full` adds the full tier. Its checks land as "demos / fast" or "demos / full";
  # the full tier adds pixels on macOS and the editor scenarios of each demo.
  demos:
    needs: ci
    if: github.event_name == 'pull_request'
    uses: moku-labs/ci/.github/workflows/demos.yml@v1
    with:
      editor: https://pkg.pr.new/@moku-labs/editor@${{ github.event.pull_request.head.sha }}
      tier: ${{ contains(github.event.pull_request.labels.*.name, 'demos:full') && 'full' || 'fast' }}
      bun_version: "1.4.2"
